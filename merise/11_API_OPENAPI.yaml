openapi: 3.0.3
info:
  title: Free QR Code SaaS API
  description: API REST du SaaS de génération de QR codes (Cloudflare Workers + D1 + R2).
  version: 1.0.0
  contact:
    name: Free QR Code Support

servers:
  - url: https://api.free-qrcode.app
    description: Production
  - url: https://api-staging.free-qrcode.app
    description: Staging
  - url: http://localhost:8787
    description: Local (Wrangler dev)

paths:
  /auth/register:
    post:
      summary: Inscription d'un nouvel utilisateur
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, motDePasse, nom, consentementMarketing]
              properties:
                email: { type: string, format: email }
                motDePasse: { type: string, minLength: 8 }
                nom: { type: string, minLength: 1 }
                consentementMarketing: { type: boolean }
      responses:
        '201':
          description: Utilisateur créé, email de confirmation envoyé
        '409':
          description: Email déjà utilisé
        '422':
          description: Données invalides

  /auth/verify-email:
    get:
      summary: Confirmation d'email
      tags: [Authentification]
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email confirmé
        '400':
          description: Token invalide ou expiré

  /auth/forgot-password:
    post:
      summary: Demander un lien de réinitialisation (réponse identique que le compte existe ou non)
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Demande prise en compte
        '400':
          description: Données invalides

  /auth/reset-password:
    post:
      summary: Réinitialiser le mot de passe via le token reçu par email
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, motDePasse]
              properties:
                token: { type: string, minLength: 1 }
                motDePasse: { type: string, minLength: 8 }
      responses:
        '200':
          description: Mot de passe réinitialisé, sessions révoquées
        '400':
          description: Token invalide, expiré, déjà utilisé ou données invalides

  /auth/login:
    post:
      summary: Connexion
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, motDePasse]
              properties:
                email: { type: string, format: email }
                motDePasse: { type: string }
      responses:
        '200':
          description: Connexion réussie, cookies access/refresh définis
          headers:
            Set-Cookie:
              schema: { type: string }
        '401':
          description: Identifiants invalides ou email non vérifié

  /auth/refresh:
    post:
      summary: Rafraîchir l'access token
      tags: [Authentification]
      security: []
      responses:
        '200':
          description: Nouvel access token
          headers:
            Set-Cookie:
              schema: { type: string }
        '401':
          description: Refresh token invalide ou révoqué

  /auth/logout:
    post:
      summary: Déconnexion (révoque le refresh token courant)
      tags: [Authentification]
      responses:
        '200':
          description: Déconnexion réussie

  /auth/sessions:
    get:
      summary: Lister les sessions actives
      tags: [Authentification]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Liste des sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tokenHash: { type: string }
                    dateCreation: { type: string, format: date-time }
                    userAgent: { type: string }
                    estRevoke: { type: boolean }
    delete:
      summary: Révoquer une session
      tags: [Authentification]
      security: [bearerAuth: []]
      parameters:
        - name: tokenHash
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session révoquée
        '404':
          description: Session introuvable

  /me:
    get:
      summary: Profil de l'utilisateur connecté
      tags: [Utilisateur]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilisateur'

  /qrcodes:
    get:
      summary: Lister les QR codes de l'utilisateur
      tags: [QR Codes]
      security: [bearerAuth: []]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: type
          in: query
          schema: { type: string, enum: [statique, dynamique] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Liste paginée des QR codes
    post:
      summary: Créer un QR code
      tags: [QR Codes]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeInput'
      responses:
        '201':
          description: QR code créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'

  /qrcodes/{id}:
    get:
      summary: Récupérer un QR code
      tags: [QR Codes]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
    patch:
      summary: Modifier un QR dynamique
      tags: [QR Codes]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contenu: { type: string }
                typeContenu:
                  type: string
                  enum: [url, texte, email, telephone, sms, wifi, vcard, geo, pdf]
                  description: >-
                    Type du nouveau contenu. Déduit du contenu si absent.
                estActif: { type: boolean }
      responses:
        '200':
          description: QR code mis à jour
    delete:
      summary: Supprimer un QR code
      tags: [QR Codes]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Supprimé

  /qrcodes/{id}/stats:
    get:
      summary: Statistiques d'un QR code
      tags: [Statistiques]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistiques agrégées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistiques'

  /qrcodes/{id}/export:
    get:
      summary: Exporter les statistiques
      tags: [Statistiques]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, xlsx, json] }
      responses:
        '200':
          description: Fichier d'export
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /qrcodes/{id}/routage:
    get:
      summary: Configuration de routage contextuel d'un QR dynamique
      tags: [Routage]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Configuration courante (null si désactivée)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingState' }
        '404': { description: QR code introuvable ou non possédé }
    put:
      summary: Enregistrer la configuration de routage
      description: >
        QR dynamique requis. Un routage actif exige au moins deux variantes et des
        priorités de règles distinctes (ordre d'évaluation déterministe).
      tags: [Routage]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingConfig' }
      responses:
        '200':
          description: Configuration enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingState' }
        '400': { description: Configuration invalide, QR statique ou fuseau inconnu }
        '402': { description: Routage réservé au plan Pro (`ROUTING_PRO_ONLY=true` et compte gratuit) }
        '404': { description: QR code introuvable }
    delete:
      summary: Désactiver le routage (retour au contenu unique)
      tags: [Routage]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Routage supprimé, contenu du QR inchangé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingState' }
        '404': { description: QR code introuvable }

  /qrcodes/{id}/routage/simuler:
    post:
      summary: Simuler la destination servie pour un contexte donné
      description: >
        Utilise la configuration enregistrée, ou celle fournie dans le corps
        (aperçu live avant sauvegarde). Renvoie la trace d'évaluation de chaque règle.
      tags: [Routage]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutingSimulationInput' }
      responses:
        '200':
          description: Destination résolue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingSimulationResult' }
        '400': { description: Aucune configuration à simuler }
        '422': { description: Configuration inexistante ou inactive }

  /qrcodes/{id}/routage/stats:
    get:
      summary: Scans par variante de routage
      description: >-
        Agrège la table `scans` par `id_variante`. Ce sont des scans, pas des
        conversions. Les scans antérieurs ou sans routage sont regroupés sous
        « Sans routage » ; une variante supprimée reste affichée avec son id brut.
      tags: [Routage]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistiques par variante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingStatsResult' }
        '400': { description: Période inversée ou paramètre invalide }
        '404': { description: QR code introuvable ou non possédé }

  /qrcodes/{id}/routage/stats.csv:
    get:
      summary: Export CSV des scans par variante
      description: Mêmes filtres que `/qrcodes/{id}/routage/stats`, séparateur `;` (Excel FR).
      tags: [Routage]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Fichier CSV
          content:
            text/csv:
              schema: { type: string }
        '400': { description: Période inversée ou paramètre invalide }
        '404': { description: QR code introuvable ou non possédé }

  /q/{aliasCourt}:
    get:
      summary: Résolution d'un QR dynamique (redirection ou contenu)
      tags: [Redirection]
      security: []
      parameters:
        - name: aliasCourt
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Contenu servi directement pour un QR dynamique non-URL : vCard en
            `text/vcard` avec `Content-Disposition: attachment` (fichier
            `.vcf`), texte/WiFi en `text/plain`. Aucun header `Location` n'est
            émis. Si le routage contextuel est actif et qu'une variante valide
            existe, la réponse est une redirection `302` à la place.
          headers:
            Content-Type:
              schema: { type: string }
              description: >-
                `text/vcard; charset=utf-8` ou `text/plain; charset=utf-8`.
            Content-Disposition:
              schema: { type: string }
              description: '`attachment; filename="contact.vcf"` pour une vCard.'
          content:
            text/vcard:
              schema: { type: string }
            text/plain:
              schema: { type: string }
        '302':
          description: >-
            Redirection vers la cible pour les types URL/PDF/email/téléphone/
            SMS/géolocalisation, ou vers une variante de routage. Si le routage
            contextuel est actif, la variante gagnante reçoit en plus
            `?cfq=<idVariante>` pour permettre au client de mesurer une
            conversion (phase 3, option B). Si le QR utilise une condition
            `minScansAppareil`/`maxScansAppareil` et qu'aucun consentement n'est
            mémorisé, la réponse est d'abord une redirection vers
            `/c/{aliasCourt}`.
        '404':
          description: >-
            Alias inconnu, QR inactif, ou destination URL invalide (aucune
            redirection n'est émise, jamais de 500).
        '410':
          description: QR supprimé définitivement

  /c/{aliasCourt}:
    get:
      summary: Page de consentement au comptage par appareil
      description: >-
        Servie uniquement pour un QR dont une règle active utilise
        `minScansAppareil`/`maxScansAppareil`, et tant qu'aucun choix (accord
        ou refus) n'est mémorisé. HTML autonome, sans JavaScript, `noindex`,
        `no-store`, budget < 10 Ko. Redirige vers `/q/{aliasCourt}` sinon.
      tags: [Consentement]
      security: []
      parameters:
        - name: aliasCourt
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Formulaire Accepter / Refuser
          content:
            text/html:
              schema: { type: string }
        '302': { description: Consentement déjà mémorisé ou QR sans condition appareil }
        '404': { description: Alias inconnu ou QR inactif }
        '410': { description: QR expiré }

  /c/{aliasCourt}/accepter:
    post:
      summary: Accepter le comptage par appareil
      description: >-
        Pose `cfq_did` (UUID aléatoire, HttpOnly, Secure, SameSite=Lax,
        13 mois), enregistre une preuve hashée SHA-256 dans `consentements`,
        puis redirige vers `/q/{aliasCourt}?cfq_decision=accept`.
      tags: [Consentement]
      security: []
      parameters:
        - name: aliasCourt
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Consentement enregistré, retour vers la redirection
          headers:
            Set-Cookie:
              schema: { type: string }
        '403': { description: Origine de formulaire non autorisée }
        '404': { description: Alias inconnu ou QR inactif }
        '410': { description: QR expiré }

  /c/{aliasCourt}/refuser:
    post:
      summary: Refuser le comptage par appareil
      description: >-
        Pose `cfq_refus=1` (6 mois, strictement nécessaire), supprime tout
        consentement antérieur pour cet appareil, puis redirige vers
        `/q/{aliasCourt}?cfq_decision=refus`. Les règles appareil sont ignorées.
      tags: [Consentement]
      security: []
      parameters:
        - name: aliasCourt
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Refus mémorisé, retour vers la redirection
          headers:
            Set-Cookie:
              schema: { type: string }
        '403': { description: Origine de formulaire non autorisée }
        '404': { description: Alias inconnu ou QR inactif }
        '410': { description: QR expiré }

  /consentement:
    get:
      summary: Page de retrait du consentement au comptage par appareil
      tags: [Consentement]
      security: []
      parameters:
        - name: retire
          in: query
          required: false
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: État du consentement et bouton de retrait
          content:
            text/html:
              schema: { type: string }

  /consentement/retirer:
    post:
      summary: Retirer le consentement au comptage par appareil
      description: >-
        Horodate `date_retrait`, remet `scans.id_appareil` à NULL pour ce hash,
        supprime `appareils_qr`, puis efface les cookies `cfq_did`, `cfq_c` et
        `cfq_refus`. Redirige vers `/consentement?retire=1`.
      tags: [Consentement]
      security: []
      responses:
        '302':
          description: Consentement retiré
          headers:
            Set-Cookie:
              schema: { type: string }
        '403': { description: Origine de formulaire non autorisée }

  /admin/routing/metrics:
    get:
      summary: Métriques d'adoption et d'intérêt du routage contextuel
      description: >-
        Comptages agrégés (aucune donnée personnelle) : QR avec routage,
        QR multi-variantes, comptes distincts, consultations de l'écran de
        stats et répartition des plans. Même protection que `/admin/dashboard`.
      tags: [Administration]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Métriques courantes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingMetrics' }
        '403': { description: Accès administrateur requis }

  /admin/campaigns:
    get:
      summary: Lister les campagnes email
      tags: [Administration]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Liste des campagnes
    post:
      summary: Créer une campagne email
      tags: [Administration]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampagneEmailInput'
      responses:
        '201':
          description: Campagne créée

  /admin/campaigns/{id}/send:
    post:
      summary: Envoyer / programmer une campagne email
      tags: [Administration]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledAt: { type: string, format: date-time }
      responses:
        '202':
          description: Campagne mise en file d'envoi

  /admin/templates:
    get:
      summary: Lister les modèles de QR
      tags: [Administration]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Liste des modèles
    post:
      summary: Créer un modèle de QR
      tags: [Administration]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeleQRInput'
      responses:
        '201':
          description: Modèle créé

  /tracking/pixel:
    get:
      summary: Pixel de tracking d'ouverture d'email
      tags: [Tracking]
      security: []
      parameters:
        - name: t
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image GIF 1x1
          content:
            image/gif:
              schema: { type: string, format: binary }

  /tracking/click:
    get:
      summary: Lien tracké dans un email
      tags: [Tracking]
      security: []
      parameters:
        - name: t
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirection vers l'URL cible

  /api-keys:
    get:
      summary: Lister les clés API
      tags: [Clés API]
      security: [bearerAuth: []]
      responses:
        '200':
          description: Liste des clés API (id = public_id, sans la clé en clair, avec prefix)
    post:
      summary: Créer une clé API
      tags: [Clés API]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom]
              properties:
                nom: { type: string }
                permissions:
                  type: array
                  items:
                    type: string
                    enum: [qrcodes:read, qrcodes:create, qrcodes:update, qrcodes:delete, stats:read, admin:campaigns, admin:templates]
                dateExpiration:
                  type: string
                  description: Toute date parseable (ISO ou datetime-local "YYYY-MM-DDTHH:mm"), doit être future
      responses:
        '201':
          description: Clé API créée (clé en clair affichée une seule fois, id = public_id)
        '400':
          description: dateExpiration invalide ou passée, permission inconnue

  /api-keys/{id}:
    delete:
      summary: Révoquer une clé API
      tags: [Clés API]
      security: [bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid, description: public_id de la clé }
      responses:
        '204':
          description: Clé API révoquée

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Clé API (préfixe + secret). Alternative : header Authorization "ApiKey <clé>". Permissions requises — qrcodes:read (GET), qrcodes:create (POST), qrcodes:update (PATCH), qrcodes:delete (DELETE), stats:read (stats). 401 clé invalide/expirée/révoquée, 403 permission manquante. Routes /admin/* : JWT admin uniquement.'

  schemas:
    Utilisateur:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        nom: { type: string }
        estVerifie: { type: boolean }
        consentementMarketing: { type: boolean }
        role: { type: string, enum: [utilisateur, admin] }
        dateInscription: { type: string, format: date-time }

    QRCodeInput:
      type: object
      required: [type, contenu]
      properties:
        type:
          type: string
          enum: [statique, dynamique]
        contenu: { type: string }
        design:
          type: object
          properties:
            couleur: { type: string }
            background: { type: string }
            logoUrl: { type: string }

    QRCode:
      type: object
      properties:
        id: { type: string }
        idUtilisateur: { type: string }
        type: { type: string, enum: [statique, dynamique] }
        contenu: { type: string }
        aliasCourt: { type: string }
        urlImage: { type: string }
        estActif: { type: boolean }
        dateCreation: { type: string, format: date-time }

    Statistiques:
      type: object
      properties:
        idQrCode: { type: string }
        periode: { type: string }
        totalScans: { type: integer }
        scansUniques: { type: integer }
        pays: { type: object, additionalProperties: { type: integer } }
        appareils: { type: object, additionalProperties: { type: integer } }

    CampagneEmailInput:
      type: object
      required: [nom, sujet, corpsHtml]
      properties:
        nom: { type: string }
        sujet: { type: string }
        corpsHtml: { type: string }
        corpsTexte: { type: string }
        cible: { type: string, enum: [tous, actifs, consentants] }

    ModeleQRInput:
      type: object
      required: [nom, type, contenu, estPublic]
      properties:
        nom: { type: string }
        type: { type: string, enum: [statique, dynamique] }
        contenu: { type: string }
        estPublic: { type: boolean }
        categorie: { type: string }

    RoutingVariante:
      type: object
      required: [id, libelle, typeSortie, contenu]
      properties:
        id: { type: string, description: Identifiant stable, immuable après création }
        libelle: { type: string }
        typeSortie: { type: string, enum: [url] }
        contenu: { type: string, description: "URL http(s) uniquement" }
        poids: { type: integer, minimum: 1, maximum: 100, description: "Réservé au test A/B (phase 3)" }
      example:
        id: v_en
        libelle: Profil EN
        typeSortie: url
        contenu: https://exemple.com/en

    RoutingConditions:
      type: object
      description: Conditions combinées en ET. Condition absente = joker.
      properties:
        jours:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: 1=lundi … 7=dimanche, dans le fuseau du QR
        heureMin: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        heureMax: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        pays:
          type: array
          items: { type: string, pattern: '^[A-Z]{2}$' }
        langues:
          type: array
          items: { type: string, pattern: '^[a-z]{2}$' }
        appareil:
          type: array
          items: { type: string, enum: [mobile, tablet, desktop] }
        minScansTotal: { type: integer, minimum: 0 }
        maxScansTotal: { type: integer, minimum: 1, description: "Borne exclusive" }
        minScansAppareil:
          type: integer
          minimum: 1
          maximum: 1000000
          description: >-
            Numéro de ce scan pour le même appareil (1 = premier scan).
            Nécessite le consentement du visiteur ; sinon la condition ne
            correspond jamais.
        maxScansAppareil:
          type: integer
          minimum: 2
          maximum: 1000000
          description: "Borne exclusive du compteur appareil consenti"
        dates:
          type: object
          description: Bornes ISO 8601 incluses, comparées à l'instant du scan.
          required: [debut, fin]
          properties:
            debut: { type: string, format: date-time }
            fin: { type: string, format: date-time }
        villes:
          type: array
          description: Villes `request.cf.city` (best-effort, casse et accents ignorés).
          items: { type: string }
        abTest:
          type: boolean
          description: Marque une règle de tirage pondéré (varianteId doit être un tableau).

    RoutingRegle:
      type: object
      required: [id, priorite, varianteId, conditions]
      properties:
        id: { type: string }
        priorite: { type: integer, description: "Évaluée dans l'ordre croissant ; première correspondance gagnante" }
        varianteId:
          oneOf:
            - type: string
            - type: array
              minItems: 2
              maxItems: 5
              items: { type: string }
          description: Tableau = tirage pondéré A/B (exige conditions.abTest = true)
        conditions: { $ref: '#/components/schemas/RoutingConditions' }

    RoutingConfig:
      type: object
      required: [version, actif, fuseau, defaut, variantes, regles]
      properties:
        version: { type: integer, enum: [1] }
        actif: { type: boolean }
        fuseau: { type: string, example: Africa/Brazzaville }
        defaut: { type: string, description: Identifiant de la variante servie si aucune règle ne correspond }
        variantes:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/RoutingVariante' }
        regles:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/RoutingRegle' }

    RoutingState:
      type: object
      properties:
        reglesRoutage:
          allOf: [{ $ref: '#/components/schemas/RoutingConfig' }]
          nullable: true
        fuseau: { type: string }
        estDynamique: { type: boolean }
        contenu: { type: string }
        limites: { $ref: '#/components/schemas/RoutingLimites' }

    RoutingLimites:
      type: object
      description: >-
        Couture de monétisation. `autorise:false` bloque uniquement la
        création/modification ; les configurations existantes continuent de
        router et `/q/:alias` ne lit jamais le plan.
      required: [plan, proOnly, autorise, variantes, regles]
      properties:
        plan: { type: string, enum: [gratuit, pro] }
        proOnly: { type: boolean }
        autorise: { type: boolean }
        variantes:
          type: integer
          nullable: true
          description: "null = illimité"
        regles:
          type: integer
          nullable: true
          description: "null = illimité"

    RoutingMetrics:
      type: object
      required:
        [proOnly, qrTotal, qrAvecRoutage, qrMultiVariantes, comptesRoutage, consultationsStats, plans, genereLe]
      properties:
        proOnly: { type: boolean }
        qrTotal: { type: integer, minimum: 0 }
        qrAvecRoutage: { type: integer, minimum: 0 }
        qrMultiVariantes:
          type: integer
          minimum: 0
          description: QR avec au moins deux variantes (usage réel)
        comptesRoutage:
          type: integer
          minimum: 0
          description: Comptes distincts ayant configuré du routage
        consultationsStats:
          type: object
          required: [total, trenteJours, comptes]
          properties:
            total: { type: integer, minimum: 0 }
            trenteJours: { type: integer, minimum: 0 }
            comptes: { type: integer, minimum: 0 }
        plans:
          type: object
          required: [gratuit, pro]
          properties:
            gratuit: { type: integer, minimum: 0 }
            pro: { type: integer, minimum: 0 }
        genereLe: { type: string, format: date-time }

    RoutingSimulationInput:
      type: object
      properties:
        config: { $ref: '#/components/schemas/RoutingConfig' }
        pays: { type: string, pattern: '^[A-Z]{2}$' }
        ville: { type: string }
        langue: { type: string, pattern: '^[a-z]{2}$' }
        appareil: { type: string, enum: [mobile, tablet, desktop] }
        scansAppareil:
          type: integer
          minimum: 1
          maximum: 1000000
          description: >-
            Numéro de ce scan pour l'appareil simulé. Omis = appareil inconnu :
            les conditions appareil ne correspondent pas.
        date: { type: string, format: date-time }
        graine: { type: string, description: "Graine du tirage A/B (défaut : simulation)" }

    RoutingEtapeEvaluation:
      type: object
      properties:
        regleId: { type: string }
        priorite: { type: integer }
        varianteId:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        correspond: { type: boolean }
        motif: { type: string }

    RoutingSimulationResult:
      type: object
      properties:
        varianteId: { type: string }
        libelle: { type: string }
        contenu: { type: string }
        regleId: { type: string, nullable: true }
        raison: { type: string }
        contexte: { type: object }
        trace:
          type: array
          items: { $ref: '#/components/schemas/RoutingEtapeEvaluation' }

    RoutingVarianteStat:
      type: object
      properties:
        varianteId: { type: string, nullable: true, description: "null = scan sans routage" }
        libelle: { type: string }
        scans: { type: integer }
        scansUniques: { type: integer }
        part: { type: number, minimum: 0, maximum: 1 }
        langues: { type: object, additionalProperties: { type: integer } }
        pays: { type: object, additionalProperties: { type: integer } }
        supprimee: { type: boolean }

    RoutingStatsAlerte:
      type: object
      properties:
        type: { type: string, enum: [variante_morte] }
        varianteId: { type: string }
        libelle: { type: string }
        message: { type: string }

    RoutingStatsResult:
      type: object
      properties:
        periode:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        totalScans: { type: integer }
        scansUniques: { type: integer }
        variantes:
          type: array
          items: { $ref: '#/components/schemas/RoutingVarianteStat' }
        alertes:
          type: array
          items: { $ref: '#/components/schemas/RoutingStatsAlerte' }
